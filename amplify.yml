version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify 콘솔 환경변수는 SSR 런타임에 자동 주입되지 않으므로 빌드 시 .env.production에 기록
            - env | grep -E '^(BACKEND_API_URL|API_ACCESS_KEY|ADMIN_ID|ADMIN_PASSWORD|SESSION_SECRET)=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
